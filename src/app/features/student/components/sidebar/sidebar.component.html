<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">C</span>

      <div>
        <h4>CampusIQ</h4>
        <small>AI Campus</small>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <a routerLink="/student/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item">
      <span>⌂</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/student/profile" routerLinkActive="active" class="nav-item">
      <span>👤</span>
      <span>My Profile</span>
    </a>

    <div class="nav-section">
      ACADEMICS
    </div>

    <a routerLink="/student/performance" routerLinkActive="active" class="nav-item">
      <span>📊</span>
      <span>Performance</span>
    </a>

    <a routerLink="/student/attendance" routerLinkActive="active" class="nav-item">
      <span>📅</span>
      <span>Attendance</span>
    </a>

    <a routerLink="/student/marks" routerLinkActive="active" class="nav-item">
      <span>📝</span>
      <span>Marks</span>
    </a>

    <a routerLink="/student/assignments" routerLinkActive="active" class="nav-item">
      <span>📚</span>
      <span>Assignments</span>
    </a>

    <a routerLink="/student/skills" routerLinkActive="active" class="nav-item">
      <span>💡</span>
      <span>Skills</span>
    </a>

    <a routerLink="/student/certifications" routerLinkActive="active" class="nav-item">
      <span>🎓</span>
      <span>Certifications</span>
    </a>

    <a routerLink="/student/projects" routerLinkActive="active" class="nav-item">
      <span>📁</span>
      <span>Projects</span>
    </a>

    <div class="nav-section">
      AI INSIGHTS
    </div>

    <a routerLink="/student/digital-twin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-cpu"></i>

      <span>
        AI Digital Twin
      </span>

    </a>


    <a routerLink="/student/performance-analysis" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-bar-chart-line"></i>

      <span>
        Performance Analysis
      </span>

    </a>


    <a routerLink="/student/skill-gap-analysis" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-bullseye"></i>

      <span>
        Skill Gap Analysis
      </span>

    </a>


    <a routerLink="/student/ai-recommendations" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-stars"></i>

      <span>
        AI Recommendations
      </span>

    </a>

    <div class="nav-section">
      CAREER
    </div>

    <a routerLink="/student/placement-readiness" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-briefcase-fill"></i>

      <span>
        Placement Readiness
      </span>

    </a>

    <a routerLink="/student/job-opportunities" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-briefcase"></i>

      <span>Job Opportunities</span>

    </a>

    <a routerLink="/student/job-applications" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link">

      <i class="bi bi-file-earmark-text"></i>

      <span>My Applications</span>

    </a>

  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">

    <button type="button" class="logout-btn" (click)="logout()">
      <span>↪</span>
      Logout
    </button>

  </div>

</aside>
