<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-header">

    <div class="logo">

      <div class="logo-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </div>

      <div>
        <h4>CampusIQ AI</h4>
        <small>Faculty Portal</small>
      </div>

    </div>

  </div>


  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Main -->
    <div class="nav-section">
      MAIN
    </div>

    <a routerLink="/faculty/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item">
      <span>
        <i class="bi bi-grid-1x2-fill"></i>
      </span>

      <span>Dashboard</span>
    </a>


    <a routerLink="/faculty/profile" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-person-circle"></i>
      </span>

      <span>Profile</span>
    </a>


    <!-- Academics -->
    <div class="nav-section">
      ACADEMICS
    </div>


    <a routerLink="/faculty/students" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-people-fill"></i>
      </span>

      <span>Students</span>
    </a>


    <a routerLink="/faculty/attendance" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-calendar-check-fill"></i>
      </span>

      <span>Attendance</span>
    </a>


    <a routerLink="/faculty/marks" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-bar-chart-fill"></i>
      </span>

      <span>Marks</span>
    </a>


    <a routerLink="/faculty/assignments" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-file-earmark-text-fill"></i>
      </span>

      <span>Assignments</span>
    </a>


    <a routerLink="/faculty/projects" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-folder-fill"></i>
      </span>

      <span>
        Projects
      </span>
    </a>


    <a routerLink="/faculty/student-performance" routerLinkActive="active" class="nav-item">
      <span>
        <i class="bi bi-graph-up-arrow"></i>
      </span>

      <span>Student Performance</span>
    </a>

  </nav>


  <!-- Footer -->
  <div class="sidebar-footer">

    <button type="button" class="logout-btn" (click)="logout()">

      <i class="bi bi-box-arrow-right"></i>

      <span>Logout</span>

    </button>

  </div>

</aside>
